<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrow Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center text-primary mb-4">Borrow Books</h2>

    <div class="card shadow border-0 mb-4">
        <div class="card-body">

            <form method="get" class="row g-3">

                <div class="col-md-5">
                    <input type="text" name="q" class="form-control" placeholder="Search title">
                </div>

                <div class="col-md-4">
                    <select name="category" class="form-select">
                        <option value="">All Categories</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-3 d-grid">
                    <button type="submit" class="btn btn-success">Search</button>
                </div>

            </form>

        </div>
    </div>

    {% for book in books %}
    <div class="card shadow-sm mb-3 border-0">
        <div class="card-body">

            <h5>{{ book.title }}</h5>
            <p class="mb-1">Author: {{ book.author }}</p>
            <p class="mb-1">Category: {{ book.category.name }}</p>
            <p class="mb-2">Available: {{ book.available }}</p>

            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="book_id" value="{{ book.id }}">
                <button type="submit" class="btn btn-primary btn-sm">
                    Borrow
                </button>
            </form>

        </div>
    </div>
    {% empty %}
    <div class="alert alert-warning text-center">
        No books available.
    </div>
    {% endfor %}

</div>

</body>
</html>
