<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
<div class="d-flex justify-content-between align-items-center mb-4">
<h2 class="text-primary">Student Dashboard</h2>
<a href="{% url 'logout' %}" class="btn btn-outline-danger">
Logout
</a>
</div>
<div class="row g-4">
<div class="col-md-4">
<div class="card shadow border-0">
<div class="card-body text-center">
<h6>Total Borrowed</h6>
<h2 class="text-success">
{{ total_borrowed }}
</h2>
</div>
</div>
</div>
<div class="col-md-4">
<div class="card shadow border-0">
<div class="card-body text-center">
<h6>Pending Requests</h6>
<h2 class="text-warning">
{{ pending_requests }}
</h2>
</div>
</div>
</div>
<div class="col-md-4">
<div class="card shadow border-0">
<div class="card-body text-center">
<h6>Total Fine</h6>
<h2 class="text-danger">
₹{{ fine_amount }}
</h2>
</div>
</div>
</div>
</div>
<div class="text-center mt-5">
<a href="/issue/borrow/" class="btn btn-primary m-2">
Request Book
</a>
<a href="/student/my-requests/" class="btn btn-info m-2">
My Requests
</a>
<a href="/issue/return/" class="btn btn-warning m-2">
Return Book
</a>
<a href="/fines/my-fines/" class="btn btn-danger m-2">
View Fines
</a>
</div>
</div>
</body>
</html>
