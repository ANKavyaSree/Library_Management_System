<!DOCTYPE html>
<html>
<head>

    <title>Books</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Available Books
    </h2>

    <table class="table table-bordered table-striped shadow">

        <thead class="table-dark">

            <tr>

                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
                <th>Available</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            {% for book in books %}

            <tr>

                <td>{{ book.title }}</td>

                <td>{{ book.author }}</td>

                <td>{{ book.category.name }}</td>

                <td>{{ book.available }}</td>

                <td>

                    {% if book.available > 0 %}

                    <a href="/teacher/borrow/{{ book.id }}/"
                       class="btn btn-primary btn-sm">

                        Borrow

                    </a>

                    {% else %}

                    <span class="badge bg-danger">
                        Out of Stock
                    </span>

                    {% endif %}

                </td>

            </tr>

            {% empty %}

            <tr>

                <td colspan="5" class="text-center">
                    No Books Available
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
