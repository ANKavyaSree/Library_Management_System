<!DOCTYPE html>
<html>
<head>

    <title>Teacher Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-5">
        Teacher Dashboard
    </h2>

    <div class="row">

        <div class="col-md-3">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h3>{{ total_books }}</h3>

                    <p>Total Books</p>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h3>{{ borrowed_books }}</h3>

                    <p>Borrowed Books</p>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h3>{{ pending_requests }}</h3>

                    <p>Pending Requests</p>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h3>{{ returned_books }}</h3>

                    <p>Returned Books</p>

                </div>

            </div>

        </div>

    </div>

    <div class="text-center mt-5">

        <a href="/teacher/books/" class="btn btn-primary">
            View Books
        </a>

        <a href="/teacher/issued-books/" class="btn btn-success">
            My Books
        </a>

        <a href="/logout/" class="btn btn-danger">
            Logout
        </a>

    </div>

</div>

</body>
</html>
