<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">

        <h2 class="text-primary">
            Book Management
        </h2>

        <div>

            <a href="/librarian/category/add/"
               class="btn btn-dark">
               Add Category
            </a>

            <a href="/librarian/books/add/"
               class="btn btn-success">
               Add Book
            </a>

        </div>

    </div>

    <table class="table table-bordered table-hover shadow">

        <thead class="table-dark">

            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
                <th>ISBN</th>
                <th>Quantity</th>
                <th>Available</th>
                <th>Actions</th>
            </tr>

        </thead>

        <tbody>

            {% for book in books %}

            <tr>

                <td>{{ book.title }}</td>
                <td>{{ book.author }}</td>
                <td>{{ book.category.name }}</td>
                <td>{{ book.isbn }}</td>
                <td>{{ book.quantity }}</td>
                <td>{{ book.available }}</td>

                <td>

                    <a href="/librarian/books/edit/{{ book.id }}/"
                       class="btn btn-warning btn-sm">
                       Edit
                    </a>

                    <a href="/librarian/books/delete/{{ book.id }}/"
                       class="btn btn-danger btn-sm">
                       Delete
                    </a>

                </td>

            </tr>

            {% empty %}

            <tr>

                <td colspan="7" class="text-center">
                    No books available
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
