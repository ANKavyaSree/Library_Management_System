{% extends 'base.html' %}

{% block title %}
    Edit Book
{% endblock %}

{% block page_title %}
    Edit Book
{% endblock %}

{% block content %}

<!-- HEADER -->

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

    <div>

        <h3 class="fw-bold text-dark mb-1">

            Update Book Details

        </h3>

        <p class="text-muted mb-0">

            Edit and manage library book information

        </p>

    </div>

    <a href="/librarian/books/"
       class="btn btn-dark rounded-pill px-4">

        <i class="fa-solid fa-arrow-left me-2"></i>

        Back

    </a>

</div>

<!-- FORM CARD -->

<div class="card border-0 shadow-sm rounded-4">

    <div class="card-body p-5">

        <div class="text-center mb-4">

            <div class="book-edit-icon mx-auto mb-3">

                <i class="fa-solid fa-pen-to-square"></i>

            </div>

            <h4 class="fw-bold text-warning">

                Edit Book

            </h4>

        </div>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <!-- BUTTON -->

            <div class="mt-4">

                <button type="submit"
                        class="btn btn-warning rounded-pill px-5 py-2">

                    <i class="fa-solid fa-floppy-disk me-2"></i>

                    Update Book

                </button>

            </div>

        </form>

    </div>

</div>

<style>

    form p{

        margin-bottom:20px;
    }

    form label{

        font-weight:600;

        margin-bottom:8px;

        display:block;

        color:#374151;
    }

    form input,
    form textarea,
    form select{

        width:100%;

        padding:12px 15px;

        border:1px solid #d1d5db;

        border-radius:12px;

        outline:none;

        transition:0.3s;
    }

    form textarea{

        min-height:120px;
    }

    form input:focus,
    form textarea:focus,
    form select:focus{

        border-color:#f59e0b;

        box-shadow:0 0 0 3px rgba(245,158,11,0.15);
    }

    .book-edit-icon{

        width:80px;

        height:80px;

        border-radius:22px;

        background:#fef3c7;

        color:#d97706;

        display:flex;

        align-items:center;

        justify-content:center;

        font-size:34px;
    }

</style>

{% endblock %}
