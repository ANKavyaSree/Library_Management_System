{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow border-0 rounded-4">

        <div class="card-body p-5 text-center">

            <h2 class="fw-bold mb-4">

                Pay Fine

            </h2>

            <h4 class="text-danger mb-4">

                Amount : ₹{{ fine.amount }}

            </h4>

            <!-- QR IMAGE -->

            <img
                src="/media/qr/payment_qr.png"
                width="250"
                class="img-fluid rounded-4 shadow-sm mb-4"
            >

            <p class="text-muted">

                Scan this QR code and complete payment

            </p>

            <hr>

            <form method="POST"
                  enctype="multipart/form-data">

                {% csrf_token %}

                <label class="fw-semibold mb-2">

                    Upload Payment Screenshot

                </label>

                {{ form.screenshot }}

                <button
                    type="submit"
                    class="btn btn-success mt-4 rounded-pill px-5">

                    Submit Payment

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
